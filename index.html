<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js Demolizione</title>

  <!--
    CRÍTICO: esms-shim-mode="manual" + shimMode forzado
    garantiza que el importmap esté listo ANTES de que
    main.js intente resolver "three" y "three/addons/".
    Sin esto el loader puede no aparecer si el shim llega tarde.
  -->
  <script>window.esmsInitOptions = { shimMode: true }</script>
  <script async src="https://unpkg.com/es-module-shims@1.7.3/dist/es-module-shims.js"></script>

  <script type="importmap-shim">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <link rel="stylesheet" href="loader.css">
  <link rel="stylesheet" href="textoverlay.css">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

  <div id="scene-text">
    <h1 id="scene-title"></h1>
    <p id="scene-body"></p>
  </div>

  <!-- ================================================
       LOADER
       Aparece inmediatamente al cargar la página.
       Se oculta cuando loaderDone() es llamado en main.js
       ================================================ -->
  <div id="loader-overlay">
    <div id="loader-corner"></div>
    <h1 id="loader-title"><span></span></h1>
    <p id="loader-subtitle">Cargando..</p>
    <div id="loader-bar-wrap">
      <div id="loader-bar-track">
        <div id="loader-bar-fill"></div>
      </div>
      <div id="loader-percent">
        <span>0%</span>
        <span id="loader-percent-num">0%</span>
      </div>
    </div>
    <p id="loader-status">Iniciando escena</p>
  </div>

  <!-- Canvas Three.js -->
  <div id="canvas-container"></div>

  <!--
    IMPORTANTE:
    - Usar type="module-shim" (no "module") para que
      es-module-shims resuelva el importmap correctamente.
    - loader.js NO se carga aquí; main.js lo importa.
  -->
  <script type="module-shim" src="./main.js"></script>

</body>

</html>
